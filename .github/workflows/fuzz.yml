name: Fuzz

permissions:
  contents: read

on:
  schedule:
    - cron: "17 1 * * *" # every night, 04:17 MSK
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time for each fuzz target
        default: 5m

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # the build cache would carry the corpus; it has its own below

      - name: Corpus path
        run: echo "CORPUS=$(go env GOCACHE)/fuzz" >> "$GITHUB_ENV"

      # The generated corpus grows from night to night: restore the latest one, save a new one.
      - uses: actions/cache@v6
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-${{ github.run_id }}
          restore-keys: fuzz-

      - name: Fuzz every target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: |
          status=0
          for target in $(go test -list '^Fuzz' . | grep '^Fuzz'); do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZTIME" . || status=1
          done
          exit $status

      # A failing input is saved to testdata/fuzz/<target>/: commit it as a regression test.
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: testdata/fuzz
